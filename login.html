<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Log ind – Mind Your Beauty</title>
  <link rel="icon" type="image/png" href="assets/logo-dark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f5f2; --surface: #ffffff; --border: #e4dfd8; --text: #2b2a28;
      --muted: #7a756e; --accent: #2b2a28; --accent-contrast: #ffffff;
      --error: #a0453a; --error-bg: #f6e6e3;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161514; --surface: #1f1e1c; --border: #353230; --text: #ece8e2;
        --muted: #9b958d; --accent: #ece8e2; --accent-contrast: #161514;
        --error: #e3a197; --error-bg: #3a2420;
        color-scheme: dark;
      }
      .logo-dark { display: none; }
      .logo-white { display: block !important; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px 16px; background: var(--bg); color: var(--text);
      font: 400 14px/1.5 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 380px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 16px; padding: 36px 32px 32px;
      box-shadow: 0 1px 2px rgba(43,42,40,.04), 0 8px 32px rgba(43,42,40,.06);
    }
    .logo { display: block; height: 52px; width: auto; margin: 0 auto 8px; }
    .logo-white { display: none; }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
      font-size: 26px; text-align: center; margin: 12px 0 4px;
    }
    .sub { text-align: center; color: var(--muted); margin: 0 0 24px; }
    label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
    input {
      width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; outline: 0;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%; border: 0; border-radius: 10px; padding: 13px; margin-top: 4px; cursor: pointer;
      font: 600 15px "Inter", sans-serif; background: var(--accent); color: var(--accent-contrast);
    }
    button:hover { opacity: .9; }
    .error {
      display: none; background: var(--error-bg); color: var(--error);
      border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; font-weight: 500; text-align: center;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo logo-dark" src="assets/logo-dark.png" alt="Mind Your Beauty" />
    <img class="logo logo-white" src="assets/logo-white.png" alt="Mind Your Beauty" />
    <h1>Prisliste Sverige 2026</h1>
    <p class="sub">Log ind for at se priserne</p>

    <div class="error" id="error" role="alert">Forkert brugernavn eller kode</div>

    <form method="post" action="/auth">
      <label for="username">Brugernavn</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
      <label for="password">Kode</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Log ind</button>
    </form>
  </main>
  <script>
    if (new URLSearchParams(location.search).has("fejl")) document.getElementById("error").classList.add("show");
  </script>
</body>
</html>
